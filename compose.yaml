services:
  postgres:
    image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_DB: schools
      POSTGRES_USER: school_owner
      POSTGRES_PASSWORD: local-owner-password
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - school-db:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/001-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_owner -d schools"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["school-redis:/data"]
  storage:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: local-storage
      MINIO_ROOT_PASSWORD: local-storage-password
    ports: ["127.0.0.1:59000:9000"]
    volumes: ["school-files:/data"]
volumes:
  school-db:
  school-redis:
  school-files:
